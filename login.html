<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal administrativo | Escola</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <main class="login-wrapper">
        <section class="login-card" aria-labelledby="titulo-login">

            <div class="login-brand">
                <img 
                    src="img/Logo Meirelles.png"
                    alt="Logo da escola"
                    class="login-logo"
                >
            </div>

            <h1 id="titulo-login">Portal administrativo</h1>

            <p class="login-subtitle">
                Acesse o painel de gerenciamento da escola
            </p>

            <form id="loginForm" class="login-form">

                <div class="form-group">
                    <label for="nome">Nome de usuário</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome de usuário"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="login-options">
                    <label class="remember-option">
                        <input type="checkbox" id="lembrarAcesso">
                        <span>Lembrar acesso</span>
                    </label>

                    <button
                        type="button"
                        id="btnEsqueciSenha"
                        class="forgot-password"
                    >
                        Esqueci a senha
                    </button>
                </div>

                <button type="submit" class="login-button">
                    Entrar
                </button>

                <p
                    id="mensagemLogin"
                    class="mensagem-login"
                    role="alert"
                    aria-live="polite"
                ></p>

            </form>

            <a href="index.html" class="back-to-site">
                Voltar para o site
            </a>

        </section>
    </main>

    <script src="login.js"></script>
</body>
</html>
